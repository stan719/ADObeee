# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@main

  # PdfCraft's own packaging tests, beside the shared lint: every package must ship each
  # craft-fonts font's licence file from the manifest (packaging/env.sh,
  # packaging/windows/font-licences.ps1).
  font-licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Font licences in packages
        run: bash packaging/tests/font-licences.sh
      - name: Font licences in Windows packages
        shell: pwsh
        run: ./packaging/tests/font-licences.ps1
