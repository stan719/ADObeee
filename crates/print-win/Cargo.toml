[package]
name = "pdfcraft-print-win"
version = "0.4.0"
edition = "2024"
description = "Impresión en Windows para PDFCraft (único lugar con `unsafe`)"
publish = false

# Sin `[lints] workspace = true`: este crate no hereda `unsafe_code = "forbid"`.

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Data_Pdf", "Foundation", "Foundation_Collections", "Graphics_Imaging",
  "Storage_Streams", "UI",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Storage_Xps",
] }
